openapi: 3.0.3
info:
  title: LumaLens API
  version: 0.1.0
  description: Engine-agnostic bug-capture API for game builds.
servers:
  - url: https://{urlId}.lambda-url.us-east-1.on.aws
    description: Lambda Function URL (deployed in the AWS Academy sandbox)
    variables:
      urlId:
        default: your-function-url-id
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com
    description: API Gateway HTTP API, $default stage (intended where API Gateway is available)
    variables:
      apiId:
        default: your-api-id
security:
  - ApiKeyAuth: []
tags:
  - name: bugs
    description: Bug report CRUD
  - name: uploads
    description: Presigned S3 upload URLs for screenshots and logs
paths:
  /bugs:
    post:
      tags: [bugs]
      operationId: createBug
      summary: Create a bug report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugReportCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [bugs]
      operationId: listBugs
      summary: List bug reports (newest first, max 500)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Status'
        - name: buildVersion
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/BugReport'
                  count:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Get a presigned S3 PUT URL for a bug's screenshot or log
      description: |
        Returns a presigned PutObject URL for `screenshots/<bugId>.png` (`image/png`) or
        `logs/<bugId>.txt` (`text/plain`), valid for `expiresIn` seconds. Upload with
        `PUT <uploadUrl>` and the exact `Content-Type` returned (no `x-lumalens-key`; S3 expects 200).
        This route does not change the report: store the key afterwards with
        `PUT /bugs/{id}` (`screenshotKey` / `logKey`). Requesting the same kind twice
        returns a URL for the same key, so a new upload overwrites the old object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: Presigned upload URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /bugs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [bugs]
      operationId: getBug
      summary: Get one bug report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [bugs]
      operationId: updateBug
      summary: Update status, severity, description, or the S3 keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugReportUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [bugs]
      operationId: deleteBug
      summary: Delete a bug report
      responses:
        '204':
          description: Deleted (empty body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-lumalens-key
  responses:
    BadRequest:
      description: Invalid JSON (`invalid_json`) or validation failure (`validation_failed`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or wrong x-lumalens-key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Bug report or route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Severity:
      type: string
      enum: [low, medium, high, crash]
    Status:
      type: string
      enum: [open, in_progress, fixed, wontfix]
    Source:
      type: string
      enum: [manual, auto]
    Engine:
      type: string
      enum: [unity, godot, unreal, web]
    RunContext:
      type: string
      enum: [editor, build]
    Platform:
      type: string
      enum: [windows, webgl, android, linux, mac]
    CoordSpace:
      type: string
      enum: [2d, 3d]
    BugReportCreate:
      type: object
      additionalProperties: false
      required: [title, severity, engine, runContext, buildVersion, platform]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
          default: open
        source:
          allOf:
            - $ref: '#/components/schemas/Source'
          default: manual
        engine:
          $ref: '#/components/schemas/Engine'
        runContext:
          $ref: '#/components/schemas/RunContext'
        buildVersion:
          type: string
          minLength: 1
          maxLength: 32
        platform:
          $ref: '#/components/schemas/Platform'
        scene:
          type: string
          maxLength: 120
        posX:
          type: number
        posY:
          type: number
        posZ:
          type: number
        coordSpace:
          $ref: '#/components/schemas/CoordSpace'
        envSnapshot:
          type: object
          additionalProperties: true
        logKey:
          type: string
        screenshotKey:
          type: string
    BugReportUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of status, severity, description, screenshotKey, logKey.
      properties:
        status:
          $ref: '#/components/schemas/Status'
        severity:
          $ref: '#/components/schemas/Severity'
        description:
          type: string
          maxLength: 2000
        screenshotKey:
          type: string
          maxLength: 200
          pattern: '^screenshots/'
          description: S3 key from POST /uploads (kind `screenshot`)
          example: screenshots/11111111-2222-4333-8444-555555555555.png
        logKey:
          type: string
          maxLength: 200
          pattern: '^logs/'
          description: S3 key from POST /uploads (kind `log`)
          example: logs/11111111-2222-4333-8444-555555555555.txt
    UploadRequest:
      type: object
      additionalProperties: false
      required: [bugId, kind]
      properties:
        bugId:
          type: string
          format: uuid
          description: id of an existing bug report
        kind:
          type: string
          enum: [screenshot, log]
    UploadTicket:
      type: object
      required: [uploadUrl, key, contentType, expiresIn]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 PutObject URL
        key:
          type: string
          example: screenshots/11111111-2222-4333-8444-555555555555.png
        contentType:
          type: string
          enum: [image/png, text/plain]
          description: Send exactly this Content-Type with the PUT; it is part of the signature
        expiresIn:
          type: integer
          description: Seconds until uploadUrl expires
          example: 300
    BugReport:
      type: object
      required:
        - id
        - title
        - severity
        - status
        - source
        - engine
        - runContext
        - buildVersion
        - platform
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/Status'
        source:
          $ref: '#/components/schemas/Source'
        engine:
          $ref: '#/components/schemas/Engine'
        runContext:
          $ref: '#/components/schemas/RunContext'
        buildVersion:
          type: string
          minLength: 1
          maxLength: 32
        platform:
          $ref: '#/components/schemas/Platform'
        scene:
          type: string
          maxLength: 120
        posX:
          type: number
        posY:
          type: number
        posZ:
          type: number
        coordSpace:
          $ref: '#/components/schemas/CoordSpace'
        envSnapshot:
          type: object
          additionalProperties: true
        logKey:
          type: string
        screenshotKey:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: validation_failed
        details:
          type: array
          description: zod issues (only for validation_failed)
          items:
            type: object
            additionalProperties: true
