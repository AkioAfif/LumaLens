# Source for docs/architecture.png (AWS Diagram-as-Code: https://github.com/awslabs/diagram-as-code)
# Regenerate: awsdac docs/architecture.dac.yaml -o docs/architecture.png
# Solid links exist today; dashed links are planned (Unity client, WebGL snippet).
# The test script's direct PUT to S3 is left out here to keep the PNG readable (see the mermaid diagram).
# Deployed in the AWS Academy sandbox, which blocks API Gateway: clients reach the Lambda through its Function URL.
Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"
  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - Clients
        - AWSCloud
    Clients:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - TestClient
        - WebGLClient
        - UnityClient
    TestClient:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "curl / test-crud script"
    WebGLClient:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "WebGL loader (planned)"
    UnityClient:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: "Unity client (planned)"
    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Preset: AWSCloudNoLogo
      Title: "AWS Academy sandbox - no custom VPC"
      Children:
        - Region
    Region:
      Type: AWS::Region
      Title: "us-east-1"
      Direction: vertical
      Children:
        - Lambda
        - Backends
    Lambda:
      Type: AWS::Lambda::Function
      Title: "Lambda lumalens-api + Function URL"
    Backends:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - Table
        - Logs
        - Bucket
    Table:
      Type: AWS::DynamoDB::Table
      Title: "DynamoDB LumaLensReports"
    Logs:
      Type: AWS::Logs::LogGroup
      Title: "CloudWatch Logs"
    Bucket:
      Type: AWS::S3::Bucket
      Title: "S3 lumalens-shots-542230"
  Links:
    - Source: TestClient
      SourcePosition: S
      Target: Lambda
      TargetPosition: W
      Type: orthogonal
      TargetArrowHead:
        Type: Open
    - Source: WebGLClient
      SourcePosition: S
      Target: Lambda
      TargetPosition: N
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
    - Source: UnityClient
      SourcePosition: S
      Target: Lambda
      TargetPosition: E
      Type: orthogonal
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
    - Source: UnityClient
      SourcePosition: E
      Target: Bucket
      TargetPosition: E
      Type: orthogonal
      LineStyle: dashed
      TargetArrowHead:
        Type: Open
    - Source: Lambda
      SourcePosition: W
      Target: Table
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open
    - Source: Lambda
      SourcePosition: S
      Target: Logs
      TargetPosition: N
      TargetArrowHead:
        Type: Open
    - Source: Lambda
      SourcePosition: E
      Target: Bucket
      TargetPosition: N
      Type: orthogonal
      TargetArrowHead:
        Type: Open
